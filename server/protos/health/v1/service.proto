syntax = "proto3";

package health.v1;

option go_package = "com.pidgey.server/generated/protos/health/v1;healthv1";

// The greeting service definition.
service PidgeyService {
  // Sends a greeting
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);

  rpc WatchHello(WatchHelloRequest) returns (stream WatchHelloResponse);
}

message WatchHelloRequest {}

message WatchHelloResponse {
  string message = 1;
}

// The request message containing the user's name.
message SayHelloRequest {
  string name = 1;
}

// The response message containing the greetings
message SayHelloResponse {
  string message = 1;
}
