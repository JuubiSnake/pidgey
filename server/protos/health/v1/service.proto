syntax = "proto3";

package health.v1;

option go_package = "com.pidgey.server/generated/protos/health/v1;healthv1";

// The greeting service definition.
service PidgeyService {
  // Sends a greeting
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);

  rpc WatchNote(WatchNoteRequest) returns (stream WatchNoteResponse);
}

message WatchNoteRequest {}

message WatchNoteResponse {
  string payload = 1;
}

// The request message containing the user's name.
message UpdateNoteRequest {
  string payload = 1;
  int64 position = 2;
}

// The response message containing the greetings
message UpdateNoteResponse {
  string message = 1;
}
